global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vllm
    # Targets come from a file so the tunnel URL can change without editing
    # this config. Prometheus re-reads the file on its own.
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
