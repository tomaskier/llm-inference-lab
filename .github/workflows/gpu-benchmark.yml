# GPU regression check. TEMPLATE ONLY: this project has no GPU runner, so this
# workflow never runs. The same steps run by hand on Kaggle (see README).
# To use it, register a self-hosted runner with an NVIDIA GPU and the label "gpu".
name: GPU benchmark

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Variant to test
        default: base
        type: choice
        options: [base, w8, w4]

jobs:
  benchmark:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/kaggle_setup.sh
      - name: Short benchmark (1 run of chat_short)
        env:
          MODELS_DIR: ${{ vars.MODELS_DIR }}
        run: python scripts/run_matrix.py --variants ${{ inputs.variant }} --workloads chat_short --runs 1
      - name: Compare with baseline
        run: python scripts/check_regression.py --results results --partial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-results
          path: |
            results/benchmarks
            build/vllm.log
